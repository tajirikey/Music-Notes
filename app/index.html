<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ドレミであそぼ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* レイアウト: 上=ヘッダー、中央=楽譜（がくふ／オルゴール）、下=画面の鍵盤（固定）。エフェクトは全画面の canvas を重ねて描く */
:root {
  --bg: #fdf9f1;
  --surface: #ffffff;
  --fg: #2a2633;
  --muted: #7a7385;
  --line: #e8e1d3;
  --accent: #2f6fdf;
  --good: #1f9d55;
  --bad: #e5484d;
  --gold: #ffc83d;
  --key-white: #ffffff;
  --key-black: #2a2633;
  --night1: #10163a;
  --night2: #2b1c52;
  --font-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  /* 音ごとの色 */
  --n0: #ff4d5e; --n2: #ff922b; --n4: #f5c400; --n5: #3fbf5a;
  --n7: #22b8e6; --n9: #4c6ef5; --n11: #b05cf0; --nsharp: #7b8494;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16141b; --surface: #211e28; --fg: #f1edf7; --muted: #a59eb2; --line: #34303d;
    --accent: #6f9cff; --good: #4ade80; --bad: #ff6b6f; --key-white: #ece8f2; --key-black: #0c0b0f;
    color-scheme: dark;
  }
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-display); font-weight: 500; font-size: 18px; line-height: 1.5;
  -webkit-user-select: none; user-select: none; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* ---- きょくえらび ---- */
#select { overflow-y: auto; gap: 18px; }
#select h1 { font-weight: 800; font-size: 2rem; margin: 8px 0 0; }
.songs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.song {
  text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 20px;
  padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;
}
.song:active { transform: scale(.98); }
.song .t { font-weight: 800; font-size: 1.35rem; }
.song .p { display: flex; gap: 4px; flex-wrap: wrap; }
.song .p span { width: 26px; height: 26px; border-radius: 8px; color: #fff; font-size: .75rem; font-weight: 800; display: grid; place-items: center; }
.song .r { color: var(--muted); font-size: .9rem; }
.foot { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; color: var(--muted); font-size: .85rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--good); }
.dot.off { background: var(--bad); }
.dot.warn { background: #f08c2b; }
.update { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: .85rem; }

/* ---- えんそう ---- */
#play { gap: 10px; }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 16px; font-weight: 800; }
.bar h2 { margin: 0; font-size: 1.4rem; font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; background: var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 800; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.progress { width: 140px; height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
.progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--n0), var(--n2), var(--n4), var(--n5), var(--n7), var(--n9), var(--n11)); background-size: 140px 100%; transition: width .25s; }
.status { display: flex; align-items: center; justify-content: center; gap: 16px; min-height: 2em; }
#msg { text-align: center; font-weight: 800; font-size: 1.2rem; }
#msg.bad { color: var(--bad); }

.stage { flex: 1; min-height: 0; position: relative; }
#score { position: absolute; inset: 0; overflow-y: auto; background: var(--surface); border: 2px solid var(--line); border-radius: 24px;
  padding: 18px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
.line { display: flex; flex-wrap: wrap; gap: 10px; }
.note {
  width: 76px; height: 76px; border-radius: 20px; color: #fff; font-weight: 800; font-size: 1.7rem;
  display: grid; place-items: center; position: relative; transition: opacity .25s, transform .15s;
  text-shadow: 0 1px 2px rgba(0,0,0,.2);
}
.note.small { font-size: 1.35rem; }
.note.done { opacity: .28; }
.note.done::after { content: "✓"; position: absolute; right: 4px; top: 0; font-size: .9rem; }
.note.now { transform: scale(1.14); box-shadow: 0 0 0 5px var(--surface), 0 0 0 9px var(--fg); animation: bob 1s ease-in-out infinite; z-index: 1; }
.note.hitpop { animation: hitpop .4s ease-out; }
.note.shake { animation: shake .35s; }
@keyframes bob { 50% { transform: scale(1.22); } }
@keyframes hitpop { 0% { transform: scale(1.5); filter: brightness(1.6); } 100% { transform: scale(1); } }
@keyframes shake { 20%,60% { transform: translateX(-8px) scale(1.14); } 40%,80% { transform: translateX(8px) scale(1.14); } }
#roll { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 24px; display: block; }

/* ---- けんばん ---- */
/* 鍵盤は本物と同じ幅で、JS が 1本ずつ位置を決める。画面の幅は左右の余白を除いた全体を使う */
#play { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
#play .bar, #play .status { padding: 0 16px; }
#play .stage { margin: 0 16px; }
.keys { position: relative; height: 150px; flex-shrink: 0; touch-action: none; overflow: hidden; }
.wk { position: absolute; top: 0; bottom: 0; background: var(--key-white); border: 2px solid var(--line); border-radius: 0 0 10px 10px;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-weight: 800; color: var(--muted); font-size: .9rem;
  transition: background .12s, box-shadow .2s; }
.bk { position: absolute; top: 0; height: 60%; background: var(--key-black); border-radius: 0 0 6px 6px; z-index: 2; }
.wk.extra { opacity: .4; }
.bk.extra { opacity: .3; }
#scaleNote { text-align: center; font-size: .8rem; color: var(--muted); margin: -6px 0 0; }

/* ---- けんばんの おおきさ あわせ ---- */
#calib { gap: 16px; overflow-y: auto; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
#calib .inner { padding: 0 16px; display: flex; flex-direction: column; gap: 14px; max-width: 760px; }
#calib h1 { font-weight: 800; font-size: 1.6rem; margin: 8px 0 0; }
#calib p { margin: 0; }
.adj { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.adj .num { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 5.5em; text-align: center; }
.round { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-size: 2rem; font-weight: 800; }
.adj input { width: 7em; font: inherit; font-size: 1.1rem; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 10px 22px; font-weight: 800; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
#calibKeys { margin-top: auto; }
.calibmark { position: absolute; top: 4px; transform: translateX(-50%); font-size: .75rem; font-weight: 800; color: var(--accent); z-index: 3; white-space: nowrap; }
.ruler { height: 26px; position: relative; flex-shrink: 0; }
.ruler i { position: absolute; bottom: 0; width: 1px; background: var(--muted); }
.ruler b { position: absolute; bottom: 12px; font-size: .7rem; color: var(--muted); transform: translateX(-50%); font-weight: 500; }
.wk.target, .bk.target { background: var(--tc); color: #fff; border-color: var(--tc); box-shadow: 0 0 24px var(--tc); }
.wk.hit, .bk.hit { filter: brightness(1.3); }
.wk.miss, .bk.miss { background: var(--bad) !important; color: #fff; }

/* ---- できた（夜空） ---- */
#done { align-items: center; justify-content: center; gap: 18px; text-align: center; z-index: 5; color: #fff;
  background: radial-gradient(ellipse at 50% 110%, var(--night2), var(--night1) 70%); }
.cheer { font-size: clamp(3.5rem, 12vw, 7rem); font-weight: 800; margin: 0; line-height: 1.1; display: flex; gap: .05em; }
.cheer span { display: inline-block; animation: drop .7s cubic-bezier(.3,1.6,.5,1) both; text-shadow: 0 0 24px currentColor; }
@keyframes drop { 0% { transform: translateY(-120vh) rotate(-30deg); } 100% { transform: none; } }
.cheer span.wave { animation: wave 1.4s ease-in-out infinite; }
@keyframes wave { 50% { transform: translateY(-14px) scale(1.06); } }
#perfect { font-size: 1.6rem; font-weight: 800; padding: 4px 22px; border-radius: 999px; color: #2a1f00;
  background: linear-gradient(90deg, #ffe066, #ffd43b, #fff3bf, #ffd43b); background-size: 200% 100%; animation: shine 1.2s linear infinite; }
@keyframes shine { to { background-position: -200% 0; } }
.stars { display: flex; gap: 18px; font-size: 4rem; line-height: 1; }
.stars span { display: inline-block; color: rgba(255,255,255,.18); transform: scale(.6); transition: transform .4s cubic-bezier(.3,1.8,.5,1), color .2s; }
.stars span.on { color: var(--gold); transform: scale(1); text-shadow: 0 0 20px var(--gold), 0 0 40px #ff922b; }
#doneText { font-size: 1.2rem; margin: 0; opacity: .9; }
#done .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.cta { background: var(--gold); color: #2a1f00; border: 0; border-radius: 999px; padding: 14px 30px; font-weight: 800; font-size: 1.3rem; box-shadow: 0 0 20px rgba(255,200,61,.5); }
.cta.sub { background: rgba(255,255,255,.12); color: #fff; box-shadow: none; border: 2px solid rgba(255,255,255,.3); }

@media (max-width: 700px) {
  .note { width: 60px; height: 60px; font-size: 1.35rem; border-radius: 16px; }
  .note.small { font-size: 1.05rem; }
  .progress { width: 80px; }
  .keys { height: 120px; }
}
@media (prefers-reduced-motion: reduce) {
  .note.now, .note.shake, .note.hitpop, .cheer span, #perfect { animation: none !important; }
}
</style>
</head>
<body>

<section id="select" class="screen">
  <h1>どの きょくを ひく？</h1>
  <div class="songs" id="songList"></div>
  <div class="foot">
    <span class="pill"><span class="dot" id="midiDot"></span><span id="midiText">MIDI: しらべています…</span></span>
    <span class="pill"><span class="dot" id="saveDot"></span><span id="saveText">ほぞん: しらべています…</span></span>
    <span class="pill"><span class="dot" id="verDot"></span><span id="verText"></span></span>
    <button class="update" id="updateBtn" type="button" hidden>あたらしい ばんに する</button>
    <button class="update" id="calibBtn" type="button">けんばんの おおきさ</button>
  </div>
</section>

<section id="calib" class="screen" hidden>
  <div class="inner">
    <h1>けんばんの おおきさを あわせよう</h1>
    <p>iPad の すぐ てまえに キーボードを おいて、がめんの けんばんと ほんものの けんばんの はばが ぴったり かさなるように「−」「＋」で あわせてね。</p>
    <div class="adj">
      <button class="round" id="calMinus" type="button" aria-label="ちいさく">−</button>
      <div class="num" id="calNum"></div>
      <button class="round" id="calPlus" type="button" aria-label="おおきく">＋</button>
    </div>
    <p class="sub" style="color:var(--muted);font-size:.9rem">おとなの ひとへ：ものさしで はかる ときは、「ド」の ひだりはし から つぎの「ド」の ひだりはし まで（白い けんばん 7こぶん）の ながさを mm で いれてください。</p>
    <div class="adj">
      <label for="calInput">1オクターブ</label>
      <input id="calInput" type="number" inputmode="decimal" min="80" max="200" step="0.5">
      <span>mm</span>
    </div>
    <div class="btns">
      <button class="btn primary" id="calDone" type="button">できた</button>
      <button class="btn" id="calReset" type="button">はじめの おおきさに もどす</button>
    </div>
    <p id="calDevice" style="color:var(--muted);font-size:.8rem"></p>
  </div>
  <div class="ruler" id="calRuler" aria-hidden="true"></div>
  <div class="keys" id="calibKeys"></div>
</section>

<section id="play" class="screen" hidden>
  <div class="bar">
    <button class="back" id="backBtn" type="button">← もどる</button>
    <h2 id="playTitle"></h2>
    <div class="seg" role="group" aria-label="ひょうじ">
      <button type="button" id="viewScore" aria-pressed="true">がくふ</button>
      <button type="button" id="viewRoll" aria-pressed="false">オルゴール</button>
    </div>
    <div class="progress" aria-hidden="true"><div id="progBar"></div></div>
  </div>
  <div class="status">
    <div id="msg" role="status"></div>
  </div>
  <div class="stage" id="stage">
    <div id="score"></div>
    <canvas id="roll" hidden></canvas>
  </div>
  <div class="keys" id="keys" aria-label="けんばん"></div>
  <p id="scaleNote" hidden>きょくが ながいので、けんばんを すこし ちいさく しています</p>
</section>

<section id="done" class="screen" hidden>
  <p class="cheer" id="cheer" aria-label="できた！"></p>
  <div id="perfect" hidden>パーフェクト！</div>
  <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
  <p id="doneText"></p>
  <div class="row">
    <button class="cta" id="againBtn" type="button">もういちど</button>
    <button class="cta sub" id="toListBtn" type="button">ほかの きょく</button>
  </div>
</section>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
  // ================= きょくデータ =================
  // 音は MIDI 番号（ド4 = 60）。1つの配列が楽譜の1行。著作権の切れた曲のみ。
  const D=60, R=62, M=64, F=65, S=67, L=69, S3=55;
  const SONGS = [
    { id: "kaeru", title: "かえるのうた", lines: [
      [D,R,M,F,M,R,D], [M,F,S,L,S,F,M], [D,D,D,D], [D,D,R,R,M,M,F,F,M,R,D] ] },
    { id: "mary", title: "メリーさんのひつじ", lines: [
      [M,R,D,R,M,M,M], [R,R,R,M,S,S], [M,R,D,R,M,M,M], [R,R,M,R,D] ] },
    { id: "kirakira", title: "きらきらぼし", lines: [
      [D,D,S,S,L,L,S], [F,F,M,M,R,R,D], [S,S,F,F,M,M,R], [S,S,F,F,M,M,R], [D,D,S,S,L,L,S], [F,F,M,M,R,R,D] ] },
    { id: "chocho", title: "ちょうちょう", lines: [
      [S,M,M,F,R,R], [D,R,M,F,S,S,S], [S,M,M,M,F,R,R,R], [D,M,S,S,M,M,M],
      [R,R,R,R,R,M,F], [M,M,M,M,M,F,S], [S,M,M,M,F,R,R,R], [D,M,S,S,M,M,M] ] },
    { id: "yorokobi", title: "よろこびのうた", lines: [
      [M,M,F,S,S,F,M,R], [D,D,R,M,M,R,R], [M,M,F,S,S,F,M,R], [D,D,R,M,R,D,D],
      [R,R,M,D,R,M,F,M,D], [R,M,F,M,R,D,R,S3], [M,M,F,S,S,F,M,R], [D,D,R,M,R,D,D] ] },
  ];

  const NAMES = ["ド","ド♯","レ","レ♯","ミ","ファ","ファ♯","ソ","ソ♯","ラ","ラ♯","シ"];
  const COLORS = { 0:"--n0", 2:"--n2", 4:"--n4", 5:"--n5", 7:"--n7", 9:"--n9", 11:"--n11" };
  const pcOf = m => ((m % 12) + 12) % 12;
  const colorOf = m => `var(${COLORS[pcOf(m)] || "--nsharp"})`;
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const hexOf = m => cssVar(COLORS[pcOf(m)] || "--nsharp");
  const isBlack = m => [1,3,6,8,10].includes(pcOf(m));
  const $ = id => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const RAINBOW = ["#ff4d5e","#ff922b","#ffd43b","#51cf66","#22b8e6","#4c6ef5","#b05cf0","#ff8cc6"];
  const FONT = '"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif';

  // ================= バージョン =================
  // 更新するときは、ここと version.json の両方を書きかえる
  const APP_VERSION = "0.4.0";
  const APP_DATE = "2026-10-31";
  (async () => {
    const dot = $("verDot"), text = $("verText"), btn = $("updateBtn");
    text.textContent = `バージョン ${APP_VERSION}（${APP_DATE}）`;
    try {
      const res = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
      const latest = (await res.json()).version;
      if (latest === APP_VERSION) { dot.className = "dot on"; text.textContent += " さいしん"; }
      else { dot.className = "dot warn"; text.textContent += ` → ${latest} が あります`; btn.hidden = false; }
    } catch (_) { text.textContent += " さいしんか かくにん できません"; }
    btn.addEventListener("click", () => location.replace(location.pathname + "?v=" + Date.now()));
  })();

  // ================= ほぞん（記録・設定） =================
  const store = (() => {
    const KEY = "doremi.records.v1", PREF = "doremi.prefs.v1";
    let ok = false;
    try { localStorage.setItem("doremi.test", "1"); ok = localStorage.getItem("doremi.test") === "1"; localStorage.removeItem("doremi.test"); } catch (_) {}
    const load = k => { try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch (_) { return {}; } };
    const save = (k, d) => { try { localStorage.setItem(k, JSON.stringify(d)); } catch (_) {} };
    return {
      ok,
      get: id => load(KEY)[id],
      record(id, miss) {
        const d = load(KEY); const r = d[id] || { plays: 0, best: null };
        r.plays++; r.best = r.best === null ? miss : Math.min(r.best, miss); r.last = Date.now();
        d[id] = r; save(KEY, d); return r;
      },
      pref: (k, v) => { const p = load(PREF); if (v === undefined) return p[k]; p[k] = v; save(PREF, p); },
    };
  })();
  $("saveDot").className = "dot " + (store.ok ? "on" : "off");
  $("saveText").textContent = store.ok ? "ほぞん: できる" : "ほぞん: できない（きろくは のこりません）";

  // ================= けんばんの じっさいの おおきさ =================
  // iPad Pro 11インチは 264ppi（1インチ = 画面の 132 ポイント）なので 1mm = 5.197 ポイント。
  // ほかの機種はわからないので、ブラウザの標準（1インチ = 96）で仮に計算し、−＋で合わせてもらう。
  const IS_IPAD = /iPad/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const PX_PER_MM = (IS_IPAD ? 132 : 96) / 25.4;
  // microKEY2 Air 49 の 1オクターブ（白鍵 7本）の幅。公式の数値が見つからないので仮の値。実機に合わせて調整する
  const DEFAULT_OCTAVE_MM = 140;
  let octaveMm = +store.pref("octaveMm") || DEFAULT_OCTAVE_MM;
  const keyPitchPx = () => octaveMm / 7 * PX_PER_MM;

  const calibMap = new Map();
  function drawCalib() {
    $("calNum").textContent = octaveMm.toFixed(1) + " mm";
    $("calInput").value = octaveMm.toFixed(1);
    const wrap = $("calibKeys");
    buildKeys(wrap, calibMap, 60, 71);
    calibMap.forEach(k => k.classList.remove("extra"));
    // ものさし（1cm ごと）。本物のものさしを当てて、画面の 1cm が正しいかも確かめられる
    const ruler = $("calRuler"); ruler.textContent = "";
    const cm = PX_PER_MM * 10, W = ruler.clientWidth;

  // 本物の大きさで入りきらないときだけ、画面の幅に合わせて縮める。戻り値: 本物の大きさで描けたか
  function buildKeys(wrap, map, lo, hi) {
    wrap.textContent = ""; map.clear();
    const W = wrap.clientWidth;
    let pitch = keyPitchPx();
    const need = [];
    for (let m = lo; m <= hi; m++) if (!isBlack(m)) need.push(m);
    const fit = Math.floor(W / pitch);
    let actual = true;
    if (need.length > fit) { pitch = W / need.length; actual = false; }
    const whites = need.slice();
    const prevWhite = m => { m--; while (isBlack(m)) m--; return m; };
    const nextWhite = m => { m++; while (isBlack(m)) m++; return m; };
    for (let side = 0; whites.length < Math.max(fit, need.length); side ^= 1) {
      if (side) whites.unshift(prevWhite(whites[0])); else whites.push(nextWhite(whites[whites.length - 1]));
    }
    const off = (W - whites.length * pitch) / 2;
    const inSong = m => m >= lo && m <= hi;
    whites.forEach((m, i) => {
      const k = document.createElement("div");
      k.className = "wk" + (inSong(m) ? "" : " extra"); k.textContent = NAMES[pcOf(m)];

    });

    viewMode = mode; store.pref("view", mode);
    $("viewScore").setAttribute("aria-pressed", mode === "score");
    $("viewRoll").setAttribute("aria-pressed", mode === "roll");
    $("score").hidden = mode !== "score";
    if (mode === "roll") { if (!$("play").hidden) roll.start(); } else roll.stop();
    if (mode === "score") update();
  }
  $("viewScore").addEventListener("click", () => setView("score"));
  $("viewRoll").addEventListener("click", () => setView("roll"));

  function startSong(s) {
    song = s; flat = s.lines.flat(); pos = 0; miss = 0; combo = 0; els = [];
    fx.clear();
    $("playTitle").textContent = s.title;
    const score = $("score"); score.textContent = "";
    s.lines.forEach(line => {
      const row = document.createElement("div"); row.className = "line";
      line.forEach(m => {
        const n = document.createElement("div");
        const name = NAMES[pcOf(m)];
        n.className = "note" + (name.length > 1 ? " small" : "");
        n.textContent = name; n.style.background = colorOf(m);
        row.appendChild(n); els.push(n);
      });
      score.appendChild(row);
    });
    songLo = Math.min(...flat); songHi = Math.max(...flat);
    setMsg("", "");
    show("play");
    rebuildPlayKeys();
    score.scrollTop = 0;
    roll.reset();
    setView(viewMode);
    update();
  }

  function setMsg(t, kind, ms) {
    const m = $("msg"); m.textContent = t; m.className = kind || "";
    clearTimeout(msgTimer);
    if (ms) msgTimer = setTimeout(() => { m.textContent = ""; m.className = ""; }, ms);
  }

  function update() {
    els.forEach((e, i) => { e.classList.toggle("done", i < pos); e.classList.toggle("now", i === pos); });
    $("progBar").style.width = (pos / flat.length * 100) + "%";
    keyEls.forEach(k => { k.classList.remove("target"); k.style.removeProperty("--tc"); });
    if (pos < flat.length) {
      const m = flat[pos]; const k = keyEls.get(m);
      if (k) { k.classList.add("target"); k.style.setProperty("--tc", colorOf(m)); }
      if (viewMode === "score") {
        const cur = els[pos];
        const box = $("score"), top = cur.parentElement.offsetTop - 18;
        if (Math.abs(box.scrollTop - top) > 4) box.scrollTop = top;
      }
    }
  }

  input.onNoteOn = m => {
    if ($("play").hidden || pos >= flat.length) return;
    const k = keyEls.get(m);
    const want = flat[pos];
    // オクターブは くべつしない（ドなら どの ドでも OK）
    if (pcOf(m) === pcOf(want)) {
      if (k) k.classList.add("hit");
      combo++;
      // エフェクトの位置
      let pt;
      if (viewMode === "roll") pt = roll.hitPoint(pos);
      else {
        const el = els[pos], r = el.getBoundingClientRect();
        pt = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        el.classList.remove("hitpop"); void el.offsetWidth; el.classList.add("hitpop");
      }
      if (pt) fx.hit(pt.x, pt.y, hexOf(want), combo);
      if (k) { const kr = k.getBoundingClientRect(); fx.hit(kr.left + kr.width / 2, kr.top + 20, hexOf(want), Math.min(combo, 4)); }
      if (combo % 5 === 0) fx.milestone();
      pos++;
      setMsg("", "");
      update();
      if (pos >= flat.length) setTimeout(finish, 450);
    } else {
      miss++; combo = 0;
      if (k) { k.classList.add("miss"); setTimeout(() => k.classList.remove("miss"), 300); const kr = k.getBoundingClientRect(); fx.miss(kr.left + kr.width / 2, kr.top + 20); }
      if (viewMode === "roll") roll.wrong(m);
      else { const cur = els[pos]; cur.classList.remove("shake"); void cur.offsetWidth; cur.classList.add("shake"); setTimeout(() => cur.classList.remove("shake"), 400); }
      setMsg(`いまのは「${NAMES[pcOf(m)]}」だよ。つぎは「${NAMES[pcOf(want)]}」`, "bad", 1800);
    }
  };
  input.onNoteOff = m => { const k = keyEls.get(m); if (k) k.classList.remove("hit"); };

  function finish() {
    const r = store.record(song.id, miss);
    const perfect = miss === 0;
    const starsN = perfect ? 3 : miss <= 3 ? 2 : 1;
    roll.stop();
    // できた！ の文字を 1文字ずつ 落とす
    const cheer = $("cheer"); cheer.textContent = "";
    [..."できた！"].forEach((ch, i) => {
      const s = document.createElement("span");
      s.textContent = ch; s.style.color = RAINBOW[(i * 2) % RAINBOW.length];
      s.style.animationDelay = (i * 0.12) + "s";
      s.addEventListener("animationend", () => { s.classList.add("wave"); s.style.animationDelay = (i * 0.15) + "s"; }, { once: true });
      cheer.appendChild(s);
    });
    $("perfect").hidden = !perfect;
    const stars = [...$("stars").children];
    stars.forEach(s => s.classList.remove("on"));
    $("doneText").textContent = perfect
      ? "まちがい 0こ！ かんぺき！"
      : `まちがい ${miss}こ（いちばん いいのは ${r.best}こ）`;
    show("done");
    fx.celebrate(perfect);
    stars.slice(0, starsN).forEach((s, i) => setTimeout(() => {
      s.classList.add("on"); fx.burstAt(s, ["#ffd43b", "#ff922b", "#fff3bf"]);
    }, 700 + i * 380));
  }

  $("backBtn").addEventListener("click", () => { roll.stop(); fx.clear(); renderList(); show("select"); });
  $("againBtn").addEventListener("click", () => startSong(song));
  $("toListBtn").addEventListener("click", () => { fx.clear(); renderList(); show("select"); });

  renderList();
})();
</script>
</body>
</html>
